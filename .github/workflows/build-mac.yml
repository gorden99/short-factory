name: 打包 Mac 桌面版

on:
  push:
    branches: [ main, master ]
    paths:
      - 'electron/**'
      - 'electron-personal/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，默认 package.json 中的版本）'
        required: false

jobs:
  build-mac:
    name: 打包 Mac 版（MCN + 个人版）
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            electron/package-lock.json
            electron-personal/package-lock.json

      - name: 清理 DMG 环境（卸载残留卷+禁用索引）
        run: |
          # 禁用 Spotlight 对 DMG 的索引（避免 hdiutil detach 被占用）
          defaults write com.apple.frameworks.diskimages skip-verify -bool true || true
          defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true || true
          # 卸载所有残留的 DMG 卷
          for dev in $(hdiutil info 2>/dev/null | grep -E '/dev/disk[0-9]+' | awk '{print $1}' | sort -u); do
            echo "卸载残留卷: $dev"
            hdiutil detach "$dev" -force || true
          done
          echo "环境清理完成"
          hdiutil info | head -5

      - name: 生成 Mac 图标 (.icns) - MCN版
        run: |
          cd electron/build
          iconutil -c icns icon.iconset
          ls -la icon.icns

      - name: 生成 Mac 图标 (.icns) - 个人版
        run: |
          cd electron-personal/build
          iconutil -c icns icon.iconset
          ls -la icon.icns

      - name: 安装依赖 - MCN版
        run: |
          cd electron
          npm install

      - name: 安装依赖 - 个人版
        run: |
          cd electron-personal
          npm install

      - name: 打包 Mac 版 - MCN版
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'false'
        run: |
          # 打包前清理残留卷
          for dev in $(hdiutil info 2>/dev/null | grep -E '/dev/disk[0-9]+' | awk '{print $1}' | sort -u); do
            hdiutil detach "$dev" -force || true
          done
          cd electron
          # 重试最多 3 次（hdiutil detach 偶发失败）
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试打包 ==="
            if npm run dist:mac; then
              echo "✅ 打包成功"
              break
            fi
            echo "⚠️ 第 $i 次失败，清理后重试..."
            for dev in $(hdiutil info 2>/dev/null | grep -E '/dev/disk[0-9]+' | awk '{print $1}' | sort -u); do
              hdiutil detach "$dev" -force || true
            done
            sleep 3
            if [ $i -eq 3 ]; then
              echo "❌ 3次尝试均失败"
              exit 1
            fi
          done
          echo "=== 打包产物 ==="
          ls -la ../downloads/*.zip 2>/dev/null || ls -la ../downloads/

      - name: 打包 Mac 版 - 个人版
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'false'
        run: |
          # 打包前清理残留卷
          for dev in $(hdiutil info 2>/dev/null | grep -E '/dev/disk[0-9]+' | awk '{print $1}' | sort -u); do
            hdiutil detach "$dev" -force || true
          done
          cd electron-personal
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试打包 ==="
            if npm run dist:mac; then
              echo "✅ 打包成功"
              break
            fi
            echo "⚠️ 第 $i 次失败，清理后重试..."
            for dev in $(hdiutil info 2>/dev/null | grep -E '/dev/disk[0-9]+' | awk '{print $1}' | sort -u); do
              hdiutil detach "$dev" -force || true
            done
            sleep 3
            if [ $i -eq 3 ]; then
              echo "❌ 3次尝试均失败"
              exit 1
            fi
          done
          echo "=== 打包产物 ==="
          ls -la ../downloads/*.zip 2>/dev/null || ls -la ../downloads/

      - name: 收集 Mac 安装包
        run: |
          mkdir -p mac-output
          find downloads -name "*.zip" -exec cp {} mac-output/ \;
          echo "=== 最终产物 ==="
          ls -lh mac-output/

      - name: 上传 Mac 安装包
        uses: actions/upload-artifact@v4
        with:
          name: 短稿工厂-Mac安装包
          path: mac-output/*.zip
          retention-days: 30
